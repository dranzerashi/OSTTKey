name: Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::Android SDK manager was not found at $sdkmanager"
            exit 1
          fi

          # The runner image may not include the exact platform and CMake
          # versions requested by this project.
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" "platforms;android-37" "cmake;3.22.1"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OSTTKEY_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Add the OSTTKEY_KEYSTORE repository secret (base64-encoded keystore)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > osttkey-release.jks
          test -s osttkey-release.jks
          chmod 600 osttkey-release.jks

      - name: Create signing properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.OSTTKEY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OSTTKEY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OSTTKEY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          required = {
              "OSTTKEY_KEYSTORE_PASSWORD": "KEYSTORE_PASSWORD",
              "OSTTKEY_KEY_PASSWORD": "KEY_PASSWORD",
              "OSTTKEY_KEY_ALIAS": "KEY_ALIAS",
          }
          missing = [secret for secret, variable in required.items() if not os.environ.get(variable)]
          if missing:
              raise SystemExit(
                  "Missing GitHub repository secret(s): " + ", ".join(missing)
              )

          def escape_property(value: str) -> str:
              escaped = []
              for character in value:
                  if character == "\\":
                      escaped.append("\\\\")
                  elif character == "\t":
                      escaped.append("\\t")
                  elif character == "\n":
                      escaped.append("\\n")
                  elif character == "\r":
                      escaped.append("\\r")
                  elif character == "\f":
                      escaped.append("\\f")
                  elif character in " =:#!":
                      escaped.append("\\" + character)
                  elif ord(character) < 0x20 or ord(character) > 0x7e:
                      encoded = character.encode("utf-16-be")
                      escaped.extend(
                          f"\\u{int.from_bytes(encoded[index:index + 2], 'big'):04x}"
                          for index in range(0, len(encoded), 2)
                      )
                  else:
                      escaped.append(character)
              return "".join(escaped)

          properties = [
              ("storePassword", os.environ["KEYSTORE_PASSWORD"]),
              ("keyPassword", os.environ["KEY_PASSWORD"]),
              ("keyAlias", os.environ["KEY_ALIAS"]),
              ("storeFile", "osttkey-release.jks"),
          ]
          content = "".join(
              f"{name}={escape_property(value)}\n" for name, value in properties
          )
          Path("keystore.properties").write_text(content, encoding="ascii")
          Path("keystore.properties").chmod(0o600)
          PY

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ ! -f "$apk" || -z "$apksigner" ]]; then
            echo "::error::Release APK or apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          apk="OSTTKey-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "OSTTKey-${GITHUB_REF_NAME}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "OSTTKey-${GITHUB_REF_NAME}.apk" \
            "OSTTKey-${GITHUB_REF_NAME}.sha256" \
            --verify-tag \
            --title "OSTTKey ${GITHUB_REF_NAME}" \
            --generate-notes
